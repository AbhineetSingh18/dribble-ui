<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <div id="main">
        <div id="navbar">
            <div id="navbar-left">
                <img src="./Dribbble.png" alt="logo">
                <h4><a href="#">Explore <i class="ri-arrow-down-s-line"></i></a></h4>
                <h4><a href="#">Find Talent <i class="ri-arrow-down-s-line"></i></a></h4>
                <h4><a href="#">Get Hired <i class="ri-arrow-down-s-line"></i></a></h4>
                <h4><a href="#">Blog</a></h4>
            </div>
            <div id="navbar-right">
                <h4><a href="#">Sign up</a></h4>
                <button type="button">Log in</button>
            </div>
        </div>

        <div id="hero-section">
                <div id="hero-left">
                    <h1>Discover the World’s Top Designers</h1>
                    <p>Explore work from the most talented and accomplished designers ready to take on your next project.</p>
                    <div id="hero-buttons">
                        <h4 class="shots" ><i class="ri-image-line"></i> Shots</h4>
                        <h4><i class="ri-user-line"></i> Designers</h4>
                        <h4><i class="ri-file-text-line"></i> Services</h4>
                    </div>
                    <label for="search"></label>
                    <input type="search" name="search" id="search" placeholder="What type of design are you interested in?" title="Search">
                    <i class="ri-search-line"></i>
                </div>
                <div id="hero-right">
                    <video loop muted autoplay src="./3d47c346ad505c96ef0d2987ea972e76.mp4"></video>
                </div>
            </div>
    </div>
</body>

</html>
